name: Build MMTJS Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build MMTJS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java
        run: java -version

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            echo "The Android project is not in the repository root."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Project contents:"
          find . -maxdepth 4 -type f | sort

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

      - name: Build MMTJS APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/MMTJS-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-APK
          path: apk-output/MMTJS-debug.apk
          if-no-files-found: error

      - name: Build complete
        run: |
          echo "=========================================="
          echo "MMTJS APK BUILD COMPLETE"
          echo "=========================================="
          ls -lh apk-output/MMTJS-debug.apk
