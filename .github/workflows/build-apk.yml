name: Build MMTJS Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find and extract MMTJS project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "      SEARCHING FOR MMTJS PROJECT"
          echo "=========================================="

          echo "Files in repository:"
          find . -maxdepth 4 -type f | sort

          mkdir -p _mmtjs_project

          # If a Gradle project already exists, use it.
          SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 || true)

          if [ -n "$SETTINGS" ]; then
            echo "Existing Android project found:"
            echo "$SETTINGS"

            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

            exit 0
          fi

          # Otherwise look for the MMTJS ZIP.
          ZIP=$(find . -type f -iname "*MMTJS*.zip" | head -n 1 || true)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No Gradle project and no MMTJS ZIP was found."
            echo ""
            echo "The repository must contain either:"
            echo "  settings.gradle"
            echo "or an MMTJS project ZIP."
            exit 1
          fi

          echo "MMTJS ZIP found:"
          echo "$ZIP"

          unzip -o "$ZIP" -d _mmtjs_project

          echo "Searching extracted project..."

          SETTINGS=$(find _mmtjs_project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found inside the ZIP."
            echo ""
            echo "Extracted files:"
            find _mmtjs_project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check complete MMTJS project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        MMTJS PROJECT DETAILS"
          echo "=========================================="
          echo "School: Mama Terttu Junior School"
          echo "App: MMTJS"
          echo "Slogan: it can be done"
          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 5 -type f | sort

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew was not found."
            echo ""
            echo "The Android project exists, but its Gradle wrapper is missing."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Check Android resources and logo
        shell: bash
        run: |
          echo "=========================================="
          echo "        CHECKING MMTJS RESOURCES"
          echo "=========================================="

          find "$PROJECT_DIR" -type f -name "AndroidManifest.xml" -print
          find "$PROJECT_DIR" -type f -name "mmtjs_logo.png" -print
          find "$PROJECT_DIR" -type f -name "*.java" -print
          find "$PROJECT_DIR" -type f -name "*.kt" -print

      - name: Build MMTJS APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "        BUILDING MMTJS APK"
          echo "=========================================="

          ./gradlew clean assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          echo "=========================================="
          echo "        GENERATED APK"
          echo "=========================================="

          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/MMTJS_Android_App.apk

          echo "Final APK:"
          ls -lh release/MMTJS_Android_App.apk

      - name: Upload MMTJS APK
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-Android-App
          path: release/MMTJS_Android_App.apk
          if-no-files-found: error
