name: Inspect MMTJS Fresh Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extract Fresh MMTJS Project
        run: |
          unzip -o MMTJS_Fresh_Project_With_Slip_Number.zip -d project

      - name: Inspect extracted project
        run: |
          echo "======================================"
          echo "FILES INSIDE THE FRESH MMTJS PROJECT"
          echo "======================================"
          find project -maxdepth 6 -type f | sort
          echo "======================================"
          echo "DIRECTORIES"
          echo "======================================"
          find project -maxdepth 4 -type d | sort
