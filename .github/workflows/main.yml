name: Build MMTJS Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -20

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract complete MMTJS project
        shell: bash
        run: |
          ZIP="MMTJS_Complete_Corrected_Project_v2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          rm -rf _mmtjs_project
          mkdir -p _mmtjs_project

          unzip -o "$ZIP" -d _mmtjs_project

          echo "Searching for Android project..."
          SETTINGS=$(find _mmtjs_project -name settings.gradle -o -name settings.gradle.kts | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            find _mmtjs_project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build MMTJS APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "        BUILDING COMPLETE MMTJS APK"
          echo "=========================================="

          gradle clean assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/MMTJS-Complete-Corrected.apk"

      - name: Upload MMTJS APK
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-Complete-Corrected-APK
          path: output/MMTJS-Complete-Corrected.apk
