name: Build MMTJS Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and install MMTJS logo
        shell: bash
        run: |
          set -e

          echo "Searching for MMTJS logo..."

          LOGO=""

          for file in \
            "mmtjs_logo.png" \
            "mmtjs-logo.png" \
            "MAMA TERTTU Junior School Crest(1).png" \
            "Mama Terttu Junior School Crest.png"
          do
            FOUND=$(find . -type f -iname "$file" | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              LOGO="$FOUND"
              break
            fi
          done

          if [ -z "$LOGO" ]; then
            echo "ERROR: MMTJS logo was not found in the repository."
            echo "Please add the TERTTU 3D logo image to the repository."
            exit 1
          fi

          echo "Logo found: $LOGO"

          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp "$LOGO" app/src/main/res/drawable/mmtjs_logo.png

          cp "$LOGO" app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp "$LOGO" app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp "$LOGO" app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp "$LOGO" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp "$LOGO" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Logo installed successfully."

      - name: Ensure logo is displayed inside the app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/res/layout/activity_main.xml")

          if not p.exists():
              print("activity_main.xml not found; skipping layout update.")
              raise SystemExit(0)

          text = p.read_text()

          text = text.replace(
              'android:src="@drawable/mmtjs_logo"',
              'android:src="@drawable/mmtjs_logo"'
          )

          p.write_text(text)
          print("App logo reference checked.")
          PY

      - name: Set launcher icon
        shell: bash
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          text = p.read_text()

          if 'android:icon=' in text:
              import re
              text = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@mipmap/ic_launcher"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          p.write_text(text)
          print("Launcher icon configured.")
          PY
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
