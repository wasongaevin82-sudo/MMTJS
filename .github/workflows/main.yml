name: Build MMTJS Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf android_project
          mkdir android_project

          unzip -q "$ZIP_FILE" -d android_project

          echo ""
          echo "Extracted files:"
          find android_project -maxdepth 4 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android_project \
            -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Find Android application module
        shell: bash
        run: |
          set -e

          APP_BUILD=$(find "$PROJECT_DIR" \
            -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "*/build/*" \
            -print0 | while IFS= read -r -d '' file; do
              if grep -q "com.android.application" "$file"; then
                echo "$file"
                break
              fi
            done)

          if [ -z "$APP_BUILD" ]; then
            echo "ERROR: Android application module was not found."
            echo ""
            echo "Build files found:"
            find "$PROJECT_DIR" -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \)
            exit 1
          fi

          APP_DIR=$(dirname "$APP_BUILD")

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Application module:"
          echo "$APP_DIR"

      - name: Add MMTJS logo automatically
        shell: bash
        run: |
          set -e

          LOGO=$(find . -maxdepth 3 -type f \
            \( -iname "mmtjs_logo.png" -o -iname "*TERTTU*.png" -o -iname "*Terttu*.png" \) \
            -not -path "./android_project/*" \
            -print -quit)

          if [ -z "$LOGO" ]; then
            echo "WARNING: MMTJS logo was not found in repository root."
            exit 0
          fi

          echo "Logo found: $LOGO"

          mkdir -p "$APP_DIR/src/main/res/drawable"

          cp "$LOGO" "$APP_DIR/src/main/res/drawable/mmtjs_logo.png"

          echo ""
          echo "Logo copied to:"
          echo "$APP_DIR/src/main/res/drawable/mmtjs_logo.png"

      - name: Check Android resources
        shell: bash
        run: |
          echo "Android resources:"
          find "$APP_DIR/src/main/res" -maxdepth 2 -type f 2>/dev/null | sort || true

          echo ""
          echo "Android manifest:"
          find "$APP_DIR/src/main" -maxdepth 2 \
            -type f -name "AndroidManifest.xml" -print || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle clean --console=plain

      - name: Build MMTJS APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "        BUILDING MMTJS APK"
          echo "=========================================="

          gradle assembleDebug \
            --console=plain \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "        MMTJS BUILD DIAGNOSIS"
          echo "=========================================="

          echo ""
          echo "FAILED TASK:"
          grep -E "Execution failed for task" \
            "$GITHUB_WORKSPACE/build.log" | tail -20 || true

          echo ""
          echo "WHAT WENT WRONG:"
          grep -A 30 -B 5 \
            "What went wrong:" \
            "$GITHUB_WORKSPACE/build.log" | head -150 || true

          echo ""
          echo "RESOURCE / AAPT ERRORS:"
          grep -Ei \
            "AAPT|resource .* not found|duplicate|AndroidManifest|manifest merger|error:" \
            "$GITHUB_WORKSPACE/build.log" | tail -100 || true

          echo ""
          echo "CAUSE:"
          grep -A 25 \
            "^Caused by:" \
            "$GITHUB_WORKSPACE/build.log" | head -120 || true

          echo ""
          echo "=========================================="

          exit $RESULT

      - name: Find APK
        if: success()
        shell: bash
        run: |
          echo "APK files found:"
          find "$PROJECT_DIR" \
            -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-build-diagnostic
          path: build.log
          if-no-files-found: warn
