name: Build MMTJS Android App

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract MMTJS project
        shell: bash
        run: |
          mkdir -p _mmtjs_project

          unzip -q MMTJS_Fixed_Crash_Project.zip -d _mmtjs_project

          PROJECT_DIR=$(find _mmtjs_project -type f -name settings.gradle -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "MMTJS project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip

          echo "$GITHUB_WORKSPACE/gradle-8.7/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build MMTJS APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle clean assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifact"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/app/build/outputs/apk/debug/app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/artifact/MMTJS-Fixed-APK.apk"

      - name: Upload MMTJS APK
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-Fixed-APK
          path: artifact/MMTJS-Fixed-APK.apk
