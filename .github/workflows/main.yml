name: Build MMTJS Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "Android SDK: $ANDROID_SDK_ROOT"

          sdkmanager --version

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP_FILE" -d android_project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Find Android application module
        shell: bash
        run: |
          set -e

          APP_BUILD=$(find "$PROJECT_DIR" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "*/build/*" \
            -print0 | while IFS= read -r -d '' file
          do
            if grep -q "com.android.application" "$file"; then
              echo "$file"
              break
            fi
          done)

          if [ -z "$APP_BUILD" ]; then
            echo "ERROR: Android application module not found."
            exit 1
          fi

          APP_DIR=$(dirname "$APP_BUILD")

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Application module:"
          echo "$APP_DIR"

      - name: Fix Kotlin duplicate classes
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " FIXING KOTLIN DEPENDENCY CONFLICT"
          echo "=========================================="

          mkdir -p "$HOME/.gradle/init.d"

          cat > "$HOME/.gradle/init.d/mmtjs-kotlin-fix.gradle" <<'EOF'
          allprojects {
              configurations.configureEach {

                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"

                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                  }
              }
          }
          EOF

          echo ""
          echo "Removed:"
          echo "  kotlin-stdlib-jdk7"
          echo "  kotlin-stdlib-jdk8"
          echo ""
          echo "Using:"
          echo "  kotlin-stdlib:1.8.22"
          echo "=========================================="

      - name: Add MMTJS logo automatically
        shell: bash
        run: |
          set -e

          LOGO=$(find . -maxdepth 3 -type f \
            \( -iname "mmtjs_logo.png" \
            -o -iname "*TERTTU*.png" \
            -o -iname "*Terttu*.png" \) \
            -not -path "./android_project/*" \
            -print -quit)

          if [ -z "$LOGO" ]; then
            echo "WARNING: MMTJS logo not found."
          else
            echo "Logo found: $LOGO"

            mkdir -p "$APP_DIR/src/main/res/drawable"

            cp "$LOGO" \
              "$APP_DIR/src/main/res/drawable/mmtjs_logo.png"

            echo "MMTJS logo added successfully."
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle clean --console=plain

      - name: Build MMTJS APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "        BUILDING MMTJS APK"
          echo "=========================================="

          gradle assembleDebug \
            --console=plain \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "        BUILD DIAGNOSIS"
          echo "=========================================="

          echo ""
          echo "FAILED TASK:"
          grep -E "Execution failed for task" \
            "$GITHUB_WORKSPACE/build.log" | tail -20 || true

          echo ""
          echo "KOTLIN ERRORS:"
          grep -E \
            "Duplicate class|kotlin-stdlib|kotlin-stdlib-jdk7|kotlin-stdlib-jdk8" \
            "$GITHUB_WORKSPACE/build.log" | tail -100 || true

          echo ""
          echo "OTHER ERRORS:"
          grep -Ei \
            "AAPT|resource .* not found|AndroidManifest|manifest merger|error:" \
            "$GITHUB_WORKSPACE/build.log" | tail -100 || true

          echo ""
          echo "=========================================="

          exit $RESULT

      - name: Find APK
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK CREATED"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-build-diagnostic
          path: build.log
          if-no-files-found: warn
