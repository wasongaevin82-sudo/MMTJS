name: Build MMTJS Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf android_project
          mkdir -p android_project

          unzip -o "$ZIP" -d android_project

          echo "Project extracted."

      - name: Find Android project automatically
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            find android_project -maxdepth 6 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install MMTJS logo
        shell: bash
        run: |
          set -e

          LOGO=$(find . -type f -name "mmtjs_logo.png" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$LOGO" ]; then
            echo "ERROR: mmtjs_logo.png was not found."
            exit 1
          fi

          echo "Logo found: $LOGO"

          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"

          cp "$LOGO" \
             "$PROJECT_DIR/app/src/main/res/drawable/mmtjs_logo.png"

          echo "Logo copied into Android project."

      - name: Create launcher icon
        shell: bash
        run: |
          set -e

          RES="$PROJECT_DIR/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          for DIR in \
            mipmap-mdpi \
            mipmap-hdpi \
            mipmap-xhdpi \
            mipmap-xxhdpi \
            mipmap-xxxhdpi
          do
            cp "$RES/drawable/mmtjs_logo.png" \
               "$RES/$DIR/ic_launcher.png"
          done

          echo "Launcher icon created."

      - name: Configure launcher icon
        shell: bash
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR" -type f \
            -name "AndroidManifest.xml" | head -n 1 || true)

          if [ -z "$MANIFEST" ]; then
            echo "WARNING: AndroidManifest.xml not found."
            echo "Continuing without changing manifest."
            exit 0
          fi

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          text = p.read_text()

          if "android:icon=" in text:
              text = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@mipmap/ic_launcher"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  "<application",
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          p.write_text(text)

          print("Launcher icon configured.")
          PY

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload MMTJS APK
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-debug-apk
          path: ${{ env.APK }}
