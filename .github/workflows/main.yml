name: Build MMTJS Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project automatically
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Found project:"
          echo "$ZIP"

          mkdir -p android_project

          unzip -o "$ZIP" -d android_project

          echo "Extracted project:"
          find android_project -maxdepth 5 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          MANIFEST=$(find android_project -type f \
            -name "AndroidManifest.xml" | head -n 1 || true)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml was not found after extraction."
            exit 1
          fi

          echo "Manifest found:"
          echo "$MANIFEST"

          PROJECT_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST")")")

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install MMTJS logo automatically
        shell: bash
        run: |
          set -e

          LOGO=$(find . -type f -name "mmtjs_logo.png" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$LOGO" ]; then
            echo "ERROR: mmtjs_logo.png was not found."
            exit 1
          fi

          echo "Logo found:"
          echo "$LOGO"

          mkdir -p "$PROJECT_DIR/src/main/res/drawable"

          cp "$LOGO" \
             "$PROJECT_DIR/src/main/res/drawable/mmtjs_logo.png"

          echo "Logo installed inside Android app."

      - name: Configure app launcher icon
        shell: bash
        run: |
          set -e

          RES="$PROJECT_DIR/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          cp "$RES/drawable/mmtjs_logo.png" \
             "$RES/mipmap-mdpi/ic_launcher.png"

          cp "$RES/drawable/mmtjs_logo.png" \
             "$RES/mipmap-hdpi/ic_launcher.png"

          cp "$RES/drawable/mmtjs_logo.png" \
             "$RES/mipmap-xhdpi/ic_launcher.png"

          cp "$RES/drawable/mmtjs_logo.png" \
             "$RES/mipmap-xxhdpi/ic_launcher.png"

          cp "$RES/drawable/mmtjs_logo.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo "Launcher icon created."

      - name: Configure AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR" -type f \
            -name "AndroidManifest.xml" | head -n 1)

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          manifest = Path(sys.argv[1])
          text = manifest.read_text()

          if "android:icon=" in text:
              text = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@mipmap/ic_launcher"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  "<application",
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          manifest.write_text(text)

          print("Launcher icon configured successfully.")
          PY

      - name: Find Gradle wrapper
        shell: bash
        run: |
          set -e

          GRADLE=$(find "$PROJECT_DIR" -type f \
            -name "gradlew" | head -n 1)

          if [ -z "$GRADLE" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          chmod +x "$GRADLE"

          echo "GRADLE=$GRADLE" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          "$GRADLE" assembleDebug

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-debug-apk
          path: ${{ env.APK }}
