name: Build MMTJS Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Find Android project automatically
        shell: bash
        run: |
          set -e

          MANIFEST=$(find . -type f -name "AndroidManifest.xml" \
            -not -path "./.git/*" | head -n 1 || true)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: No AndroidManifest.xml found."
            echo "Repository contents:"
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "AndroidManifest found:"
          echo "$MANIFEST"

          ANDROID_DIR=$(dirname "$(dirname "$MANIFEST")")
          echo "Android module:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Install MMTJS TERTTU logo automatically
        shell: bash
        run: |
          set -e

          LOGO=$(find . -type f \( \
            -iname "mmtjs_logo.png" -o \
            -iname "mmtjs-logo.png" -o \
            -iname "MAMA TERTTU Junior School Crest(1).png" -o \
            -iname "Mama Terttu Junior School Crest.png" \
          \) -not -path "./.git/*" | head -n 1 || true)

          if [ -z "$LOGO" ]; then
            echo "ERROR: The MAMA TERTTU 3D logo was not found in the repository."
            echo "The logo must exist somewhere in the repository for the workflow to copy it."
            exit 1
          fi

          echo "Logo found:"
          echo "$LOGO"

          mkdir -p "$ANDROID_DIR/src/main/res/drawable"

          cp "$LOGO" "$ANDROID_DIR/src/main/res/drawable/mmtjs_logo.png"

          echo "Logo installed inside Android app."

      - name: Configure launcher icon automatically
        shell: bash
        run: |
          set -e

          RES="$ANDROID_DIR/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          for DIR in \
            mipmap-mdpi \
            mipmap-hdpi \
            mipmap-xhdpi \
            mipmap-xxhdpi \
            mipmap-xxxhdpi
          do
            cp "$RES/drawable/mmtjs_logo.png" \
               "$RES/$DIR/ic_launcher.png"
          done

          echo "Launcher icon files created."

      - name: Configure AndroidManifest automatically
        shell: bash
        run: |
          set -e

          MANIFEST=$(find "$ANDROID_DIR" -type f \
            -name "AndroidManifest.xml" | head -n 1)

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          manifest = Path(sys.argv[1])
          text = manifest.read_text()

          if 'android:icon=' in text:
              text = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@mipmap/ic_launcher"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          manifest.write_text(text)

          print("Launcher icon configured:")
          print("@mipmap/ic_launcher")
          PY

      - name: Find Gradle wrapper automatically
        shell: bash
        run: |
          set -e

          GRADLE=$(find . -type f -name "gradlew" \
            -not -path "./.git/*" | head -n 1 || true)

          if [ -z "$GRADLE" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          echo "Gradle wrapper:"
          echo "$GRADLE"

          chmod +x "$GRADLE"

          echo "GRADLE_WRAPPER=$GRADLE" >> "$GITHUB_ENV"

      - name: Build APK automatically
        run: |
          "$GRADLE_WRAPPER" assembleDebug

      - name: Find APK automatically
        shell: bash
        run: |
          APK=$(find . -type f -name "*.apk" \
            -path "*/build/outputs/*" | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload MMTJS APK
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-debug-apk
          path: ${{ env.APK }}
