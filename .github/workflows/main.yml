name: Build MMTJS Android App

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME" -maxdepth 4 -type f 2>/dev/null | head -100
            exit 1
          fi

          echo "Found sdkmanager at:"
          echo "$SDKMANAGER"

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate MMTJS project
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "Gradle project found in repository root."

          elif [ -f "MMTJS_Fixed_Crash_Project.zip" ]; then
            echo "ZIP project found. Extracting..."

            mkdir -p _mmtjs_project
            unzip -q "MMTJS_Fixed_Crash_Project.zip" -d _mmtjs_project

            PROJECT_DIR=$(find "_mmtjs_project" -type f -name gradlew -print -quit)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: gradlew was not found inside the ZIP."
              find "_mmtjs_project" -maxdepth 5 -type f | head -100
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PROJECT_DIR")

            echo "Project found at:"
            echo "$PROJECT_DIR"

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          else
            echo "ERROR: MMTJS Android project was not found."
            ls -la
            exit 1
          fi

      - name: Build MMTJS APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifact

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/app/build/outputs/apk/debug/app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "artifact/MMTJS-Fixed-APK.apk"

      - name: Upload MMTJS APK
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-Fixed-APK
          path: artifact/MMTJS-Fixed-APK.apk
