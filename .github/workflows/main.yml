name: Build MMTJS Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extract MMTJS project
        run: |
          unzip -o MMTJS_Fresh_Project_With_Slip_Number.zip -d project

      - name: Copy latest school logo
        run: |
          mkdir -p project/MMTJS/app/src/main/res/drawable
          cp mmtjs_logo.png project/MMTJS/app/src/main/res/drawable/mmtjs_logo.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        working-directory: project/MMTJS
        run: gradle wrapper

      - name: Fix Kotlin dependencies automatically
        working-directory: project/MMTJS
        run: |
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build APK
        working-directory: project/MMTJS
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-debug-apk
          path: project/MMTJS/app/build/outputs/apk/debug/app-debug.apk
