name: Build MMTJS Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Extract project automatically
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)

          if [ -z "$ZIP" ]; then
            echo "No ZIP found. Using repository directly."
            mkdir -p android_project
            cp -r . android_project/ 2>/dev/null || true
          else
            echo "Project ZIP: $ZIP"
            rm -rf android_project
            mkdir android_project
            unzip -o "$ZIP" -d android_project
          fi

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project was not found."

            echo "Repository files:"
            find . -maxdepth 6 -type f | sort | head -250

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Locate Android app module
        shell: bash
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR" -type f \
            -name "AndroidManifest.xml" | head -n 1 || true)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."

            find "$PROJECT_DIR" -maxdepth 8 -type f | sort | head -300

            exit 1
          fi

          MAIN_DIR=$(dirname "$MANIFEST")

          APP_DIR=$(dirname "$(dirname "$MAIN_DIR")")

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Android app module:"
          echo "$APP_DIR"

      - name: Install MMTJS logo automatically
        shell: bash
        run: |
          set -e

          LOGO=$(find . -type f \
            \( -iname "mmtjs_logo.png" \
               -o -iname "mmtjs-logo.png" \) \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$LOGO" ]; then
            echo "ERROR: mmtjs_logo.png not found."
            exit 1
          fi

          echo "Using logo:"
          echo "$LOGO"

          mkdir -p "$APP_DIR/src/main/res/drawable"

          cp "$LOGO" \
            "$APP_DIR/src/main/res/drawable/mmtjs_logo.png"

          echo "Logo installed."

      - name: Create launcher icon automatically
        shell: bash
        run: |
          set -e

          RES="$APP_DIR/src/main/res"

          for D in \
            mipmap-mdpi \
            mipmap-hdpi \
            mipmap-xhdpi \
            mipmap-xxhdpi \
            mipmap-xxxhdpi
          do
            mkdir -p "$RES/$D"

            cp "$RES/drawable/mmtjs_logo.png" \
              "$RES/$D/ic_launcher.png"
          done

          echo "Launcher icons created."

      - name: Configure launcher icon
        shell: bash
        run: |
          set -e

          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found at expected location."
            exit 0
          fi

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          text = p.read_text()

          if "android:icon=" in text:
              text = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@mipmap/ic_launcher"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  "<application",
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          p.write_text(text)

          print("Launcher icon configured.")
          PY

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install required Android components
        shell: bash
        run: |
          set +e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            || true

          echo "Android SDK preparation complete."

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle clean --stacktrace --console=plain || true

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          gradle assembleDebug \
            --stacktrace \
            --console=plain \
            2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD RESULT: $RESULT"
          echo "========================================"

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "========== BUILD ERROR =========="

            grep -A 25 -B 5 \
              -E "What went wrong:|Execution failed for task|Caused by:" \
              build.log | head -150 || true

            echo ""
            echo "========== LAST 80 LINES =========="

            tail -n 80 build.log
          fi

          exit $RESULT

      - name: Find APK automatically
        if: success()
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK created:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload MMTJS APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-debug-apk
          path: ${{ env.APK }}
