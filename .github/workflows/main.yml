name: Build MMTJS Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf android_project
          mkdir -p android_project

          unzip -o "$ZIP" -d android_project

          echo "Project extracted."

      - name: Find Android project automatically
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."

            echo "Files found:"
            find android_project -maxdepth 7 -type f | sort | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Find Android app module
        shell: bash
        run: |
          set -e

          APP_DIR=$(find "$PROJECT_DIR" -type f \
            -name "AndroidManifest.xml" \
            | head -n 1 | xargs -r dirname)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: AndroidManifest.xml not found."

            find "$PROJECT_DIR" -maxdepth 8 -type f | sort | head -300

            exit 1
          fi

          APP_DIR=$(dirname "$(dirname "$APP_DIR")")

          echo "Android app module:"
          echo "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install MMTJS logo
        shell: bash
        run: |
          set -e

          LOGO=$(find . -type f \
            -name "mmtjs_logo.png" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$LOGO" ]; then
            echo "ERROR: mmtjs_logo.png was not found."
            exit 1
          fi

          echo "Logo found:"
          echo "$LOGO"

          mkdir -p "$APP_DIR/src/main/res/drawable"

          cp "$LOGO" \
            "$APP_DIR/src/main/res/drawable/mmtjs_logo.png"

          echo "Logo copied into app."

      - name: Create launcher icon
        shell: bash
        run: |
          set -e

          RES="$APP_DIR/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          for DIR in \
            mipmap-mdpi \
            mipmap-hdpi \
            mipmap-xhdpi \
            mipmap-xxhdpi \
            mipmap-xxxhdpi
          do
            cp "$RES/drawable/mmtjs_logo.png" \
              "$RES/$DIR/ic_launcher.png"
          done

          echo "Launcher icons created."

      - name: Configure launcher icon
        shell: bash
        run: |
          set -e

          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "WARNING: Manifest not found at:"
            echo "$MANIFEST"
            exit 0
          fi

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re
          import sys

          manifest = Path(sys.argv[1])
          text = manifest.read_text()

          if "android:icon=" in text:
              text = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@mipmap/ic_launcher"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  "<application",
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          manifest.write_text(text)

          print("Launcher icon configured.")
          PY

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          gradle assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Show actual build error
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "       ACTUAL BUILD ERROR"
          echo "========================================"

          grep -A 30 -B 10 \
            -E "What went wrong|Caused by:|FAILURE:" \
            build.log || true

          echo ""
          echo "========================================"
          echo "       LAST 100 LINES"
          echo "========================================"

          tail -n 100 build.log || true

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload MMTJS APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMTJS-debug-apk
          path: ${{ env.APK }}
